# WireMock sidecar for Outpost integration tests (G99-mock-server).
#
# Runs alongside wp-env's WordPress containers. Used by the integration
# suite via the OUTPOST_TEST_MOCK_SERVER_URL constant + the
# Outpost_Mock_Server_Filter that rewrites outbound HTTP for the
# hardcoded list of upstream API hosts.
#
# Local dev:
#
#   cd tests/mock-server && docker compose up -d
#   composer test:integration
#   docker compose down
#
# CI: see .github/workflows for the equivalent service definition.

services:
  wiremock:
    # Pin to `latest` for now — `wiremock/wiremock:3` major-tag alias
    # was deprecated on Docker Hub (manifest unknown). Repin to a
    # specific X.Y.Z when stable behavior matters.
    image: wiremock/wiremock:latest
    container_name: outpost-wiremock
    ports:
      # Host port 8080, NOT 8888/8889 — wp-env claims those, AND
      # wp_http_validate_url() (called by wp_safe_remote_get during
      # Og_Inbound::fetch and other safe fetchers) rejects non-standard
      # ports. Default-allowed are 80, 443, 8080 only. 8080 satisfies
      # both constraints.
      - "8080:8080"
    volumes:
      - ./wiremock-mappings:/home/wiremock/mappings:ro
    command: >
      --port 8080
      --verbose
      --global-response-templating
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/__admin/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
