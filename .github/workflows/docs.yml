name: Docs

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      # The Storybook published at /storybook/: its config, the stories and
      # everything they import, and the files its build and a11y run read.
      - '.storybook/**'
      - 'pwa/src/**'
      - 'assets/svg/**'
      - 'tests/fixtures/pkiw/**'
      - 'bin/test-storybook-a11y.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      # Same list as pull_request above.
      - '.storybook/**'
      - 'pwa/src/**'
      - 'assets/svg/**'
      - 'tests/fixtures/pkiw/**'
      - 'bin/test-storybook-a11y.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
  workflow_dispatch:

env:
  VALE_VERSION: 3.9.4

jobs:
  quality:
    name: Build and quality checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            docs/package-lock.json
            package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Install Storybook dependencies
        working-directory: .
        run: npm ci

      # Astro empties docs/dist on build, so the Storybook goes in after it.
      # Pages publishes this folder at /outpost/storybook/.
      - name: Build Storybook into the site
        working-directory: .
        run: |
          npm run build-storybook
          cp -R storybook-static docs/dist/storybook

      - name: Markdown lint
        run: npm run lint:md

      - name: Prose lint (Vale)
        run: |
          curl -sL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" | tar xz vale
          ./vale --minAlertLevel=error src/content

      - name: Internal link check
        run: CHECK_STORYBOOK=1 SKIP_EXTERNAL=1 npm run check:links

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility check (axe)
        run: npm run check:a11y

      # Every story in both schemes at both viewports, plus the manager page,
      # served from the built site at the path Pages publishes it under.
      - name: Storybook accessibility check (axe)
        working-directory: .
        run: npm run test:storybook-a11y -- docs/dist/storybook --base /outpost/storybook/

      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
