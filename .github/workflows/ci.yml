name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-section5:
    name: Section 5 Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run §5 audit lint
        # Five checks: B1 case-study handle leakage, B2 embedded
        # credential heuristics, B3 hardcoded silo instance URLs,
        # B4 untranslated capabilities() strings, B5 personal data
        # in test fixtures. Required check on main per F4.
        run: bash bin/lint/section-5-audit.sh

  lint-php:
    name: PHPCS + PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.2-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.2-composer-

      - run: composer install --no-progress --prefer-dist --no-interaction

      - name: PHPCS (WordPress-Extra + PHPCompatibilityWP)
        run: composer lint

      - name: PHPStan (level 6, phpstan-wordpress)
        run: composer analyze

  test-php:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - run: composer install --no-progress --prefer-dist --no-interaction

      - name: PHPUnit unit suite
        run: composer test:unit

  test-js:
    name: TypeScript + Vitest + build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --no-audit --no-fund

      - name: TypeScript strict typecheck
        run: npx tsc --noEmit

      - name: Vitest unit suite
        run: npm test

      - name: Vite production build smoke
        # Verifies the bundle assembles. Doesn't compare hashes — committed
        # build/pwa/ is what staging deploys reference; CI rebuilds for
        # smoke only and discards the output.
        run: npm run build

  test-integration:
    name: Integration suite (wp-env + WireMock)
    runs-on: ubuntu-latest
    # Integration tests run against a real WordPress install via @wordpress/env
    # plus a WireMock sidecar for upstream HTTP stubbing. The job's smoke
    # criterion: wp-env starts, Outpost loads, the mock-server admin endpoint
    # is reachable. Per-cluster stub migrations land as follow-up PRs that
    # consume this infrastructure (see docs/dev/g99-stub-migration-inventory.md).
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.2-integration-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.2-integration-

      - run: npm ci --no-audit --no-fund

      - run: composer install --no-progress --prefer-dist --no-interaction

      - name: Start WireMock sidecar
        # The mock-server compose stack from PR #56. Binds 8888 on the runner
        # so wp-env's tests-cli container can reach WireMock via the Docker
        # bridge gateway.
        working-directory: tests/mock-server
        run: docker compose up -d

      - name: Wait for WireMock health
        run: |
          for i in $(seq 1 24); do
            if curl -sf http://localhost:8890/__admin/health >/dev/null 2>&1; then
              echo "WireMock ready after $((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "WireMock failed to become healthy in 120s"
          docker compose -f tests/mock-server/docker-compose.yml logs
          exit 1

      - name: Start wp-env
        # First start pulls the WP/MySQL/PHP images (cached on subsequent runs).
        # The tests env mirrors the dev env config plus WP_DEBUG_LOG enabled.
        run: npm run wp-env:start

      - name: Run integration suite
        # Mock server URL passes through wp-env's tests-cli via --env. The
        # integration bootstrap promotes the env var to the
        # OUTPOST_TEST_MOCK_SERVER_URL constant the filter + helper expect.
        # 172.17.0.1 is the docker0 bridge gateway IP on Linux runners — the
        # tests-cli container's view of the runner host where WireMock binds.
        env:
          OUTPOST_TEST_MOCK_SERVER_URL: http://172.17.0.1:8890
        run: |
          npx wp-env run tests-cli --env-cwd=wp-content/plugins/outpost \
            bash -c 'OUTPOST_TEST_MOCK_SERVER_URL="${{ env.OUTPOST_TEST_MOCK_SERVER_URL }}" composer test:integration'

      - name: wp-env logs (on failure)
        if: failure()
        run: npm run wp-env:logs || true

      - name: WireMock logs (on failure)
        if: failure()
        run: docker compose -f tests/mock-server/docker-compose.yml logs || true

      - name: Stop wp-env
        if: always()
        run: npm run wp-env:stop || true

      - name: Stop WireMock
        if: always()
        working-directory: tests/mock-server
        run: docker compose down || true
