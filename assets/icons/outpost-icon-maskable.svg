<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-label="Outpost">
  <title>Outpost</title>
  <!-- Maskable variant: full-bleed background + smaller graphic in the
       center 40% safe zone so Android adaptive-icon masks don't clip
       the visual. -->
  <rect width="192" height="192" fill="#241c4a"/>
  <circle cx="96" cy="96" r="36" fill="none" stroke="#fb8500" stroke-width="11"/>
  <circle cx="96" cy="96" r="10" fill="#fb8500"/>
</svg>
